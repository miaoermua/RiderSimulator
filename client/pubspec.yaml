name: rider_client
description: 骑手模拟器 · 骑手端（Flutter）
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # WebSocket 客户端。协议见 ../packages/protocol.json
  web_socket_channel: ^3.0.1
  # 扫码登录：扫烽火台生成的 `ridersim://login?...` 二维码。
  #
  # 相机是原生能力，所以 **必须先 `flutter create . --platforms=android,ios`
  # 生成原生工程**，否则 Android Studio / 真机上跑不起来（本机没有 Flutter，
  # 这一步还没做，见 client/README.md）。
  #
  # 上界卡在 7.0：7.x 起 `MobileScanner` 必须传 controller，这里只想用最朴素的
  # 用法（见 screens/scan_login_page.dart）。
  mobile_scanner: ">=5.2.3 <7.0.0"
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
