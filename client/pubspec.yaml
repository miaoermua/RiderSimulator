name: rider_client
description: 骑手模拟器 · 骑手端（Flutter）
publish_to: "none"
version: 0.2.6+8

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # WebSocket 客户端。协议见 ../packages/protocol.json
  web_socket_channel: ^3.0.1
  # 扫码登录：扫烽火台生成的 `ridersim://login?...` 二维码。
  #
  # 相机是原生能力，所以**必须有原生工程**才能跑扫码页。
  # `android/` 与 `ios/` 已生成（包名见 README 的「打包标识」一节），
  # web 平台拿不到相机，那边只能用手填 + 「粘贴」。
  #
  # 6.x 在 Android 15/16 上相机起不来（报 "An unexpected error occurred."，
  # 是插件的 generic 错误码，底层是 CameraX 初始化失败）。7.x 换了新的
  # controller 生命周期并带上错误回调，见 screens/scan_login_page.dart。
  mobile_scanner: ^7.4.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # 系统原生 Toast：Android 上是真 Toast、iOS 是浮条、Web 走 toastify。
  # SnackBar 是页面内横幅，会压住底栏、还会顶掉上一条，
  # 不适合「按完按钮立刻给反馈」这种场景。
  fluttertoast: ^10.0.2
  geolocator: ^14.1.1
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.3
  audioplayers: ^6.8.1
  file_picker: ^13.2.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # 空态插画（大厅 / 待取 / 待送三个 tab 共用）。
    - assets/illustrations/
